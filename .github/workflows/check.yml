name: Check

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Dart version
        run: |
          dart --version

      - name: Safe directory
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Install dependencies
        run: |
          for dir in pkgs/*/; do
            if [ -d "$dir" ]; then
              echo "Installing dependencies for $dir"
              cd "$dir"
              dart pub get
              cd - > /dev/null
            fi
          done

      - name: Run format
        run: |
          dart format .

      - name: Run analyze
        run: |
          for dir in pkgs/*/; do
            if [ -d "$dir" ]; then
              echo "Analyzing $dir"
              cd "$dir"
              dart analyze
              cd - > /dev/null
            fi
          done

      - name: Run tests
        run: |
          for dir in pkgs/*/; do
            if [ -d "$dir/test" ]; then
              echo "Testing $dir"
              cd "$dir"
              dart test
              cd - > /dev/null
            fi
          done

      - name: Check git diff
        run: |
          git diff --exit-code
